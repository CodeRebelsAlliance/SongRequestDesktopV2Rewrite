<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presentation - SongRequest V2</title>
<link rel="stylesheet" href="presentation.css">
<link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="mobile.css">
  <style>
    /* Shown only when the host publishes a stage URL (mobile): a TV without a
       cable opens the same page from this address. */
    #pres-stage-server { display: none; position: fixed; right: 14px; bottom: 14px; z-index: 50;
                         text-align: center; color: #9a9a9a; font-size: 11px; }
    #pres-stage-server img { display: block; width: 110px; height: 110px; margin: 6px auto 4px;
                             border-radius: 8px; background: #fff; padding: 4px; }
    #pres-stage-server .pres-tv-url { font-family: Consolas, monospace; color: #c8c8c8; }
  </style>
</head>
<body>
  <div id="pres-stage-server"></div>
  <div id="pres-zoom" role="group" aria-label="Presentation zoom">
    <button id="pres-zoom-out" title="Zoom out"><i class="fas fa-minus"></i></button>
    <button id="pres-zoom-value" title="Reset zoom">100%</button>
    <button id="pres-zoom-in" title="Zoom in"><i class="fas fa-plus"></i></button>
  </div>
<div id="presentation-root">
  <!-- Player panel (left) - has gradient background -->
  <div id="pres-player-panel">
    <div id="pres-top-bar">
      <button id="btn-fullscreen" title="Toggle fullscreen"><i class="fas fa-expand"></i></button>
      <img src="SRshortLogo.png" id="pres-logo" alt="SongRequest V2">
    </div>
    <div id="presentation-top">
      <div id="presentation-artwork"><i class="fas fa-music"></i></div>
      <div id="presentation-info">
        <div id="presentation-title">No track playing</div>
        <div id="presentation-artist">—</div>
      </div>
    </div>

    <div id="lyrics-wrapper">
      <div id="presentation-lyrics"></div>
      <div id="lyrics-provider"></div>
    </div>

    <div id="presentation-bottom">
      <div id="presentation-progress">
        <span id="pres-progress-current">0:00</span>
        <div id="pres-progress-track">
          <div id="pres-progress-fill" style="width:0%"></div>
        </div>
        <span id="pres-progress-total">0:00</span>
      </div>
    </div>
  </div>

  <!-- Side panels (right) - no background color -->
  <div id="pres-side">
    <div id="pres-queue-panel">
      <div id="pres-queue-header"><i class="fas fa-list-ul"></i> Up Next</div>
      <div id="pres-queue-list"></div>
    </div>
    <div id="pres-qr-panel">
      <img id="pres-qr-logo" src="LargeSR.png" alt="Logo">
      <div id="pres-qr-code"></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="_framework/hybridwebview.js"></script>
<script src="hostbridge.js"></script>
<script src="presentation.js"></script>
</body>
</html>
