name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Build a self-contained app for every supported platform/architecture.
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest }
          - { rid: win-arm64,   os: windows-latest }
          - { rid: linux-x64,   os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-latest }
          - { rid: osx-x64,     os: macos-latest }
          - { rid: osx-arm64,   os: macos-latest }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SongRequestDesktopV2Rewrite.slnx

      - name: Build
        run: dotnet build SongRequestDesktopV2Rewrite.slnx --configuration Release --no-restore

      # Unit tests run in the dedicated `test` job.

      - name: Publish (self-contained, ${{ matrix.rid }})
        run: >
          dotnet publish SongRequestDesktopV2Rewrite/SongRequestDesktopV2Rewrite.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=false
          --output publish

      # FFmpeg/FFprobe and yt-dlp are external tools the app expects next to the
      # executable (see SongRequestDesktopV2Rewrite/tools/README.md). They are
      # fetched on a best-effort basis so a changed download URL never fails the
      # whole build.
      - name: Bundle helper binaries (best effort)
        continue-on-error: true
        shell: bash
        run: |
          set -u
          mkdir -p publish/tools
          rid="${{ matrix.rid }}"

          # yt-dlp — used to import YouTube cookies from a browser.
          if [[ "$rid" == win-* ]]; then
            curl -fsSL -o publish/tools/yt-dlp.exe \
              https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          else
            curl -fsSL -o publish/tools/yt-dlp \
              https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp
            chmod +x publish/tools/yt-dlp
          fi

          # ffmpeg + ffprobe — required for audio playback and metadata.
          if [[ "$rid" == linux-* ]]; then
            if [[ "$rid" == linux-arm64 ]]; then arch=arm64; else arch=amd64; fi
            curl -fsSL -o /tmp/ff.tar.xz \
              "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-${arch}-static.tar.xz"
            mkdir -p /tmp/ff && tar -xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            cp /tmp/ff/ffmpeg /tmp/ff/ffprobe publish/tools/
          elif [[ "$rid" == win-* ]]; then
            curl -fsSL -o /tmp/ff.zip \
              "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
            unzip -q -o /tmp/ff.zip -d /tmp/ff
            cp /tmp/ff/ffmpeg-*/bin/ffmpeg.exe /tmp/ff/ffmpeg-*/bin/ffprobe.exe publish/tools/
          else
            curl -fsSL -o /tmp/ffmpeg.zip "https://evermeet.cx/ffmpeg/getrelease/zip"
            curl -fsSL -o /tmp/ffprobe.zip "https://evermeet.cx/ffprobe/getrelease/zip"
            mkdir -p /tmp/ff
            unzip -q -o /tmp/ffmpeg.zip -d /tmp/ff
            unzip -q -o /tmp/ffprobe.zip -d /tmp/ff
            cp /tmp/ff/ffmpeg /tmp/ff/ffprobe publish/tools/
            chmod +x publish/tools/ffmpeg publish/tools/ffprobe
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "SongRequest-${{ matrix.rid }}.zip" -Force

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "SongRequest-${{ matrix.rid }}.tar.gz" -C publish .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SongRequest-${{ matrix.rid }}
          path: SongRequest-${{ matrix.rid }}.*
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # All tests (unit + integration + JS) with coverage floors. Every suite runs
  # even if an earlier one fails, a detailed summary is written to the job
  # summary, and the job fails at the end if anything failed.
  #
  # This job is named "Tests" so it can be selected as a required branch
  # protection check (see tests/README.md).
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      # Headless audio: OpenAL Soft uses its null backend so the audio tests run
      # without a sound card (also set in tests/coverage.runsettings, which the
      # test host applies before loading the test assembly).
      ALSOFT_DRIVERS: "null"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg (integration tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libayatana-appindicator3-1

      - name: Enable the ALSA sequencer for the MIDI tests (best effort)
        continue-on-error: true
        run: sudo modprobe snd-seq && ls -l /dev/snd/seq

      - name: Restore
        run: dotnet restore SongRequestDesktopV2Rewrite.slnx

      - name: Unit tests
        id: unit
        continue-on-error: true
        run: >
          dotnet test tests/SongRequestDesktopV2Rewrite.UnitTests/UnitTests.csproj
          --configuration Release
          --settings tests/coverage.runsettings
          --logger "trx;LogFileName=unit.trx"
          --logger "console;verbosity=normal"
          --blame
          --collect:"XPlat Code Coverage"
          --results-directory TestResults/unit

      - name: Integration tests
        id: integration
        continue-on-error: true
        # dbus-run-session provides a session bus so the MPRIS tests really run (they
        # skip without one, which used to drop the measured coverage below the floor).
        run: >
          dbus-run-session -- dotnet test tests/SongRequestDesktopV2Rewrite.IntegrationTests/IntegrationTests.csproj
          --configuration Release
          --settings tests/coverage.runsettings
          --logger "trx;LogFileName=integration.trx"
          --logger "console;verbosity=normal"
          --blame
          --collect:"XPlat Code Coverage"
          --results-directory TestResults/integration

      - name: JavaScript tests
        id: js
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p TestResults
          node --test tests/js 2>&1 | tee TestResults/js.txt

      - name: Coverage floors
        id: coverage
        continue-on-error: true
        run: |
          python3 tests/check-coverage.py TestResults/unit 0.36
          python3 tests/check-coverage.py TestResults/integration 0.17

      - name: Test summary
        if: always()
        shell: bash
        env:
          SUITE_OUTCOME_UNIT: ${{ steps.unit.outcome }}
          SUITE_OUTCOME_INTEGRATION: ${{ steps.integration.outcome }}
          SUITE_OUTCOME_JS: ${{ steps.js.outcome }}
          SUITE_OUTCOME_COVERAGE: ${{ steps.coverage.outcome }}
        run: |
          mkdir -p TestResults
          python3 tests/test-summary.py TestResults/unit TestResults/integration
          {
            echo ""
            echo "### JavaScript tests"
            echo '```'
            tail -n 25 TestResults/js.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any suite failed
        if: |
          steps.unit.outcome == 'failure' ||
          steps.integration.outcome == 'failure' ||
          steps.js.outcome == 'failure' ||
          steps.coverage.outcome == 'failure'
        run: |
          echo "::error title=Tests failed::One or more test suites or coverage floors failed. See the job summary above for the failing tests."
          exit 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**

  # ---------------------------------------------------------------------------
  # Mobile (Android) APK. Linux is enough: SongRequest.Mobile only adds the iOS
  # target when built on macOS, and the GitHub runner already ships the Android
  # SDK and a JDK. The APK joins the release as an extra asset (the desktop
  # archive check below still requires all six platform archives).
  # ---------------------------------------------------------------------------
  build-android:
    name: Build (android)
    runs-on: ubuntu-latest
    # In-app updates only work when every release is signed with the *same* key.
    # Add ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS /
    # ANDROID_KEY_PASSWORD as repository secrets to use a proper release keystore;
    # without them the debug keystore is cached across runs so it stays stable.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the MAUI Android workload
        shell: bash
        run: |
          # During a .NET servicing rollout the advertised workload *set* can point
          # at manifests that are not on nuget.org yet, which aborts the install
          # ("Version X of package ... is not found in NuGet feeds"). Manifests mode
          # installs from the SDK's bundled, consistent manifests instead;
          # --skip-manifest-update covers the same gap. The plain install remains a
          # fallback for future SDKs.
          dotnet workload config --update-mode manifests
          dotnet workload install maui-android --skip-manifest-update \
            || dotnet workload install maui-android

      # Fallback: keep the automatically generated debug keystore between runs.
      # A fresh debug key per run is what made Android answer "App not installed".
      - name: Restore a stable signing key (debug fallback)
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Configure release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_SIGNING_ARGS=-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/release.keystore -p:AndroidSigningStorePass=$ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS -p:AndroidSigningKeyPass=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Publish APK
        shell: bash
        run: >
          dotnet publish SongRequest.Mobile/SongRequest.Mobile.csproj
          --configuration Release
          --framework net10.0-android
          -p:AndroidPackageFormat=apk
          $ANDROID_SIGNING_ARGS
          --output publish-android

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find publish-android -name '*-Signed.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "::error title=No APK::publish-android contains no signed APK."
            exit 1
          fi
          cp "$apk" SongRequest-android.apk
          ls -la SongRequest-android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SongRequest-android
          path: SongRequest-android.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Decide whether this run publishes a release: every manual dispatch, and any
  # push to master/main whose <Version> has no tag yet (i.e. a new version).
  # ---------------------------------------------------------------------------
  version:
    name: Version
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag_exists: ${{ steps.check.outputs.tag_exists }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      previous_tag: ${{ steps.check.outputs.previous_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # git tag / git describe need the tags

      - name: Read <Version> and look for its tag
        id: check
        shell: bash
        run: |
          set -euo pipefail

          # The product version (<Version> in Directory.Build.props) is the single
          # source of truth: it is shown in the UI, compared against the release tag
          # by the in-app updater, used verbatim as the release tag here, and
          # inherited by the desktop, core and mobile projects alike.
          version=$(python3 -c "import re,pathlib;t=pathlib.Path('Directory.Build.props').read_text(encoding='utf-8');m=re.search(r'<Version>\s*([^<\s]+)\s*</Version>',t);print(m.group(1) if m else '')")
          if [ -z "$version" ]; then
            echo "::error::Could not read <Version> from Directory.Build.props."
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Unexpected <Version> value '$version'."
            exit 1
          fi
          tag="v$version"

          git fetch --tags --quiet
          previous_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)

          if git tag -l "$tag" | grep -q .; then
            tag_exists=true
          else
            tag_exists=false
          fi

          # A push only releases a version that is not tagged yet (a version bump is
          # what "there is something to release" means); a manual dispatch always
          # tries, and the release job reports a clear error if the tag exists.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$tag_exists" = "false" ]; then
            should_release=true
          else
            should_release=false
          fi

          echo "version=$version -> tag $tag (tag exists: $tag_exists, previous tag: ${previous_tag:-none})"
          echo "should_release=$should_release (event: ${{ github.event_name }})"

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "tag_exists=$tag_exists"
            echo "should_release=$should_release"
            echo "previous_tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Create the release with every platform archive. Runs on a manual dispatch, or
  # automatically on a push to master/main that bumps <Version> — and only once
  # the build and the whole test suite (job "Tests") have passed.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: [build, test, build-android, version]
    if: needs.version.outputs.should_release == 'true'
    runs-on: windows-latest
    # Serialized per branch so a second run cannot clobber a release mid-upload.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the changelog is generated from the git log

      - name: Refuse to re-release a tagged version (manual runs)
        if: github.event_name == 'workflow_dispatch' && needs.version.outputs.tag_exists == 'true'
        shell: bash
        run: |
          echo "::error title=Tag already exists::Tag ${{ needs.version.outputs.tag }} already exists. Bump <Version> in Directory.Build.props before releasing."
          exit 1

      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          # Only the platform archives: the test job also uploads artifacts, and
          # those must never end up as release assets.
          pattern: SongRequest-*
          merge-multiple: true

      - name: Verify the platform archives are present
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist/
          count=$(ls dist/SongRequest-* 2>/dev/null | wc -l)
          if [ "$count" -lt 6 ]; then
            echo "::error title=Missing release archives::Expected the 6 desktop platform archives (plus the mobile APK) in dist/, found $count."
            exit 1
          fi
          echo "Found $count release archives."

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          prev="${{ needs.version.outputs.previous_tag }}"
          if [ -n "$prev" ]; then
            log=$(git log "$prev..HEAD" --pretty=format:"- %s")
          else
            log=$(git log --pretty=format:"- %s")
          fi
          [ -n "$log" ] || log="- No changes"

          {
            echo "changelog<<EOF"
            echo "## Changes"
            echo "$log"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.changelog }}
          # Tag the commit this run built, not whatever the branch points at later.
          target_commitish: ${{ github.sha }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Release"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| version | \`${{ needs.version.outputs.version }}\` |"
            echo "| tag | \`${{ needs.version.outputs.tag }}\` |"
            echo "| trigger | \`${{ github.event_name }}\` |"
            echo "| previous tag | \`${{ needs.version.outputs.previous_tag }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
